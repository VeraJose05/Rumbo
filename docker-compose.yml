# RNF-02: base vectorial Chroma en local. Arrancar con `docker compose up -d`.
services:
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - '8000:8000'
    volumes:
      # Los datos quedan en data/chroma (ignorado por git) y sobreviven a reinicios del contenedor.
      - ./data/chroma:/data
    restart: unless-stopped
