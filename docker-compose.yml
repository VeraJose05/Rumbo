# RNF-02: base vectorial Chroma en local. Arrancar con `docker compose up -d`.
services:
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - '8000:8000'
    volumes:
      # Los datos quedan en data/chroma (ignorado por git) y sobreviven a reinicios del contenedor.
      - ./data/chroma:/data
    restart: unless-stopped
  reranker:
    # RF-09 (C2): cross-encoder bge-reranker-v2-m3 (multilingüe, Apache 2.0) servido por
    # text-embeddings-inference de Hugging Face. En CPU, para dejar la GPU a Ollama.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    command: --model-id BAAI/bge-reranker-v2-m3
    ports:
      - '8080:80'
    volumes:
      # El modelo se descarga la primera vez y queda en data/reranker (ignorado por git).
      - ./data/reranker:/data
    restart: unless-stopped
