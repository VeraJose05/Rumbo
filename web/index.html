<!doctype html>
<!-- RF-12: interfaz web de Rumbo. La sirve la API (npm run api) en http://127.0.0.1:3400 o el despliegue (RNF-10). -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rumbo · Planifica tu viaje</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23c4553a'/%3E%3Cpath d='M16 6l4 10-4 10-4-10z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <header class="barra">
      <div class="marca">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" />
          <path d="M16 6l4 10-4 10-4-10z" />
        </svg>
        <span>Rumbo</span>
      </div>
      <button id="nuevo" class="boton-secundario" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        Nuevo viaje
      </button>
    </header>

    <main id="conversacion" aria-live="polite">
      <div id="mensajes"></div>
      <div id="sugerencias" class="sugerencias" hidden>
        <button type="button">4 días en Sevilla con mi pareja</button>
        <button type="button">Un fin de semana en Granada</button>
        <button type="button">Barcelona con niños, sin gastar mucho</button>
      </div>
    </main>

    <footer class="pie">
      <form id="formulario" class="compositor">
        <textarea id="entrada" rows="1" placeholder="Escribe tu mensaje…" aria-label="Tu mensaje" autofocus></textarea>
        <button id="enviar" type="submit" aria-label="Enviar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </button>
      </form>
      <p class="atribucion">
        Guías de <a href="https://es.wikivoyage.org" target="_blank" rel="noopener">Wikivoyage</a>
        (<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.es" target="_blank" rel="noopener">CC BY-SA 4.0</a>) ·
        <span id="privacidad"></span>
      </p>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
