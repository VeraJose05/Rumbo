<!doctype html>
<!-- RF-12: portada de Rumbo («cuaderno de viaje»): historias de los destinos y billete para empezar.
     La sirve la API (npm run api) o el despliegue (RNF-10). -->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2622" />
    <title>Rumbo · Planifica tu viaje</title>
    <meta name="description" content="Planifica conversando. Viaja con fundamento: itinerarios por España con lugares sacados de la guía." />
    <link rel="icon" href="marca/simbolo.svg" />
    <link rel="preload" href="fuentes/fraunces.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="cuaderno.css" />
    <link rel="stylesheet" href="inicio.css" />
  </head>
  <body class="portada">
    <main class="inicio">
      <section class="historias" aria-roledescription="carrusel" aria-label="Destinos con guía">
        <div class="historias-fotos"></div>
        <div class="historias-velo"></div>
        <ol class="historias-progreso" aria-hidden="true"></ol>

        <header class="inicio-barra">
          <a class="inicio-marca" href="./" aria-label="Rumbo, inicio">
            <img src="marca/simbolo.svg" alt="" width="34" height="34" />
            <span>rumbo</span>
          </a>
        </header>

        <div class="historia-texto" aria-live="polite">
          <span class="historia-region pegatina"></span>
          <h1 class="titulo-xl historia-nombre"></h1>
        </div>

        <button class="historias-zona historias-anterior" type="button" aria-label="Destino anterior"></button>
        <button class="historias-zona historias-siguiente" type="button" aria-label="Destino siguiente"></button>
        <a class="historia-credito" target="_blank" rel="noopener"></a>
      </section>

      <div class="billete inicio-billete aparece">
        <p class="antetitulo">Billete de viaje</p>
        <h2 class="titulo">¿A dónde vamos?</h2>
        <p class="suave inicio-lema">Arma tu ruta sin prisas y a tu rollo.</p>
        <a id="empezar" class="boton boton-ancho" href="chat.html">
          Empezar mi viaje
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </a>
        <a class="inicio-chat" href="chat.html">o cuéntamelo por chat</a>
        <div class="billete-talon">
          <span>Sin registro ni cuentas</span>
          <span id="privacidad" class="inicio-privacidad"></span>
        </div>
      </div>
    </main>

    <script type="module" src="inicio.js"></script>
  </body>
</html>
